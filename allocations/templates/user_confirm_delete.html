{% extends 'base.html' %}

{% block content %}
  <h1>Delete user</h1>
  <p>Are you sure you want to delete {{ shown_user }}? This cannot be undone.</p>
  <form method="post" action="{% url 'user_delete' shown_user.id %}">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a class="btn btn-secondary" href="{% url 'user_detail' shown_user.id %}">Cancel</a>
  </form>
{% endblock %}
