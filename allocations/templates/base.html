<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Group Allocation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar bg-body-tertiary mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'home' %}">Group Allocation</a>
      <div class="nav">
        {% if user.is_authenticated %}
          <a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
          {% if user.is_superuser %}
            <a class="nav-link" href="{% url 'user_list' %}">Users</a>
          {% endif %}
          <a class="nav-link" href="{% url 'profile' %}">Profile</a>
          <a class="nav-link" href="{% url 'password' %}">Password</a>
          <form method="post" action="{% url 'log_out' %}">
            {% csrf_token %}
            <button type="submit" class="nav-link">Log out</button>
          </form>
        {% else %}
          <a class="nav-link" href="{% url 'log_in' %}">Log in</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
